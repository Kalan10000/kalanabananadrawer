<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KALAN OS — Game Icon Drawer</title>
    <style>
      :root {
        --bg-1: #14100e;
        --bg-2: #1d1714;
        --panel: rgba(19, 15, 13, 0.9);
        --panel-strong: #171311;
        --panel-soft: #221b18;
        --border: rgba(255, 240, 225, 0.13);
        --text: #f5f1ed;
        --muted: #b6aca4;
        --dim: #847971;
        --gold: #facc15;
        --red: #ef4444;
        --green: #4ade80;
        --shadow: rgba(0, 0, 0, 0.7);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 12px 12px, rgba(255, 236, 214, 0.06) 2.4px, transparent 3px),
          linear-gradient(180deg, var(--bg-2), var(--bg-1));
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 28px;
      }

      .shell {
        width: min(1200px, 100%);
        min-height: 760px;
        background: rgba(16, 12, 10, 0.8);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.72);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(20, 16, 14, 0.94);
      }

      .brand {
        font-family: "Press Start 2P", "Courier New", monospace;
        letter-spacing: 0.08em;
        font-size: 14px;
        color: var(--text);
        text-shadow: 0 2px 0 #000;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      button, select, textarea {
        font: inherit;
      }

      .drawer-trigger {
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }

      .drawer-trigger:hover { background: rgba(255,255,255,0.08); }

      .workspace {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr) 360px;
        gap: 0;
        min-height: 700px;
      }

      .sidebar,
      .right-panel {
        background: rgba(18, 14, 12, 0.9);
        border-right: 1px solid var(--border);
      }

      .sidebar {
        padding: 18px 18px 0;
      }

      .panel-group {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 16px;
      }

      .label {
        display: inline-block;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      select {
        width: 100%;
        border: 1px solid var(--border);
        background: rgba(10, 8, 8, 0.9);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 9px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .small-btn,
      .action-btn,
      .chip-btn {
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        border-radius: 8px;
        cursor: pointer;
      }

      .small-btn {
        min-height: 34px;
        padding: 0 10px;
      }

      .action-btn {
        flex: 1 1 120px;
        min-height: 36px;
        padding: 0 12px;
      }

      .chip-btn {
        min-height: 30px;
        padding: 0 10px;
      }

      .chip-btn.is-active {
        background: rgba(250, 204, 21, 0.16);
        border-color: rgba(250, 204, 21, 0.5);
      }

      .palette-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .swatch {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 9px;
        border: 2px solid transparent;
        cursor: pointer;
        position: relative;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
      }

      .swatch.is-selected {
        border-color: var(--text);
        box-shadow: 0 0 0 2px rgba(255,255,255,0.14), inset 0 1px 0 rgba(255,255,255,0.2);
      }

      .swatch[data-color='transparent']::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(45deg, rgba(255,255,255,0.14) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.14) 50%, rgba(255,255,255,0.14) 75%, transparent 75%, transparent);
        background-size: 10px 10px;
      }

      .editor-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, rgba(23, 18, 17, 0.72), rgba(22, 17, 15, 0.88));
        padding: 26px 18px;
      }

      .stage {
        width: min(520px, 100%);
        aspect-ratio: 1;
        background: rgba(9, 7, 7, 0.8);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .pixel-board {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: repeat(16, minmax(0, 1fr));
        gap: 2px;
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
        padding: 6px;
      }

      .pixel {
        width: 100%;
        aspect-ratio: 1;
        border: 0;
        background: transparent;
        border-radius: 3px;
        padding: 0;
        cursor: crosshair;
        transition: transform 80ms ease;
      }

      .pixel:hover { transform: scale(1.08); }

      .pixel[data-filled='true'] {
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18);
      }

      .pixel[data-filled='true'][data-color='transparent'] {
        background: transparent;
      }

      .right-panel {
        border-right: none;
        border-left: 1px solid var(--border);
        padding: 18px 18px 0;
      }

      .preview-box {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 18px;
        min-height: 220px;
      }

      .sprite-preview {
        width: 180px;
        height: 180px;
        display: grid;
        grid-template-columns: repeat(16, minmax(0, 1fr));
        gap: 2px;
        background: rgba(0,0,0,0.2);
        border-radius: 12px;
        padding: 8px;
      }

      .sprite-preview .pixel {
        cursor: default;
        pointer-events: none;
        border-radius: 2px;
      }

      .meta-card {
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
      }

      .meta-card h3 {
        margin: 0 0 6px;
        font-size: 14px;
      }

      .meta-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      textarea {
        width: 100%;
        min-height: 180px;
        resize: vertical;
        background: rgba(10, 8, 8, 0.9);
        color: #dfe7ff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        margin-top: 10px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .sidebar,
        .right-panel {
          border: none;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">KALAN OS</div>
        <div class="top-actions">
          <button id="drawerToggle" class="drawer-trigger" type="button">Toggle Icon Drawer</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <div class="panel-group">
            <span class="label">Game</span>
            <div class="field">
              <select id="templateSelect">
                <option value="blank">Blank icon</option>
                <option value="puzzle-time-attack">Puzzle Time Attack</option>
                <option value="conways-climber">Conway’s Climber</option>
                <option value="neon-fall">Neon Fall</option>
                <option value="simple-sandbox">Simple Sandbox</option>
                <option value="kalans-coding-language">Kalan’s Coding Language</option>
                <option value="squishy-ball-runner">Squishy Ball Runner</option>
              </select>
            </div>
          </div>

          <div class="panel-group">
            <span class="label">Paint</span>
            <div class="toolbar">
              <button id="paintMode" class="chip-btn is-active" type="button">Paint</button>
              <button id="eraseMode" class="chip-btn" type="button">Erase</button>
              <button id="fillMode" class="chip-btn" type="button">Fill</button>
            </div>
          </div>

          <div class="panel-group">
            <span class="label">Palette</span>
            <div id="paletteGrid" class="palette-grid"></div>
          </div>

          <div class="panel-group">
            <span class="label">Actions</span>
            <div class="toolbar">
              <button id="clearBtn" class="action-btn" type="button">Clear</button>
              <button id="randomBtn" class="action-btn" type="button">Randomize</button>
            </div>
          </div>
        </aside>

        <main class="editor-shell">
          <div class="stage">
            <div id="pixelBoard" class="pixel-board" aria-label="Pixel art editor"></div>
          </div>
        </main>

        <aside class="right-panel">
          <div class="preview-box">
            <div id="spritePreview" class="sprite-preview" aria-label="Generated icon preview"></div>
          </div>

          <div class="meta-card">
            <h3>Export</h3>
            <p>Copy this sprite block into your game config. It uses the same palette style as your KALAN OS cartridges.</p>
            <textarea id="exportBox" readonly aria-label="Sprite export code"></textarea>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const GRID_SIZE = 16;

      const PALETTE = {
        '0': '#0d0d16', '1': '#f2f2f7', '2': '#b8b8c8', '3': '#6b6b85', '4': '#2a2a3d',
        'r': '#ef4444', 'R': '#991b1b', 'o': '#fb923c', 'y': '#facc15', 'Y': '#a16207',
        'g': '#4ade80', 'G': '#15803d', 'c': '#22d3ee', 'C': '#0e7490', 'b': '#60a5fa',
        'B': '#1d4ed8', 'p': '#c084fc', 'P': '#7e22ce', 'm': '#b45309', 'M': '#78350f',
        's': '#94a3b8', 'transparent': 'transparent'
      };

      const PALETTE_ORDER = [
        'transparent', '0', '1', '2', '3', '4',
        'r', 'o', 'y', 'g', 'c', 'b', 'p', 'm', 's', 'R', 'Y', 'G', 'C', 'B', 'P', 'M'
      ];

      const GAME_TEMPLATES = {
        blank: [
          '................',
          '................',
          '................',
          '................',
          '................',
          '................',
          '................',
          '................',
          '................',
          '................',
          '................',
          '................',
          '................',
          '................',
          '................',
          '................'
        ],
        'puzzle-time-attack': [
          '......0000......',
          '.....0yyyy0..00.',
          '......0YY0..0rr0',
          '....000yy000.00.',
          '...0yyy11yyy0...',
          '..0yy110011yy0..',
          '.0yy11101111yy0.',
          '.0y1111011111y0.',
          '.0y10110rrr10y0.',
          '.0y1111111111y0.',
          '.0YY11111111YY0.',
          '..0YY110011YY0..',
          '...0YYY11YYY0...',
          '....00YYYY00....',
          '......0000......',
          '................'
        ],
        'conways-climber': [
          '.4.4.4.4.4.4.4..',
          '4.4.4.000.4.4.4.',
          '.4.4.0ggg0.000..',
          '4.4..0g1g00ggg0.',
          '.4.00000000g1g0.',
          '4.0ggg0.4.00000.',
          '.40g1g04.4.000..',
          '4.00000.000GGG0.',
          '.4.4.4.0gggGGG0.',
          '4.000..0gg1000..',
          '.0ggg0.0000.4.4.',
          '40gGg00GGG04.4..',
          '.000000GGG0.000.',
          '4.0GGG0000.0GGG0',
          '.40GGG0.4..0GGG0',
          '..00000....00000'
        ],
        'neon-fall': [
          '......c..c......',
          '....c.c..c......',
          '.....000000.....',
          '.....0cccc0.....',
          '...000cc1c000...',
          '...0cccccccc0...',
          '...0000000000...',
          '.4............4.',
          '.4........00004.',
          '.40000....0oo04.',
          '.40pp0....0oo04.',
          '.40pp000000oo04.',
          '.40pppp1yyroo04.',
          '.40rrgyyyyrrr04.',
          '.40rrggbbbrrr04.',
          '.44444444444444.'
        ],
        'simple-sandbox': [
          '.....0000.......',
          '....0rrrr0..000.',
          '....0r1rr0.0bb10',
          '.....0000..0bbb0',
          '..y.........000.',
          '...o..0000......',
          '......0oo0..y...',
          '.00...0oo0...00.',
          '.0m0..0000..0m0.',
          '.0m0..yyyy..0m0.',
          '.0m0.yyyyyy.0m0.',
          '.0m0yyyyyyyy0m0.',
          '.0m0YYYYYYYY0m0.',
          '.0mmmmmmmmmmmm0.',
          '.0MMMMMMMMMMMM0.',
          '..000000000000..'
        ],
        'kalans-coding-language': [
          '.00000000000000.',
          '0222222222222220',
          '0200000000000020',
          '0204444444444020',
          '0204p0.......020',
          '0204.p0......020',
          '0204p0.ggg...020',
          '0204........4020',
          '0204cc.pppp.4020',
          '0204..yyyy..4020',
          '0204444444444020',
          '0200000000000020',
          '02222222222g2220',
          '.00000333300000.',
          '....02222220....',
          '...0000000000...'
        ],
        'squishy-ball-runner': [
          '................',
          '.....000000.....',
          '...00rrrrrr00...',
          '..0rr11rrrrrr0..',
          '.0rr11rrrrrrrr0.',
          '.0rrrr0rr0rrrr0.',
          '.0rrrr0rr0rrrr0.',
          '..0RRRRRRRRRR0..',
          '...00RRRRRR00...',
          '..o..000000.....',
          '.o.........00...',
          '..o.......0ss0..',
          '.........0s33s0.',
          '0000000000000000',
          '3322332233223322',
          '4444444444444444'
        ]
      };

      const state = {
        selectedColor: '#facc15',
        mode: 'paint',
        pixels: Array.from({ length: GRID_SIZE * GRID_SIZE }, () => null),
        activeTemplate: 'blank'
      };

      const pixelBoard = document.getElementById('pixelBoard');
      const spritePreview = document.getElementById('spritePreview');
      const paletteGrid = document.getElementById('paletteGrid');
      const exportBox = document.getElementById('exportBox');
      const templateSelect = document.getElementById('templateSelect');
      const drawerToggle = document.getElementById('drawerToggle');

      function charFromHex(hex) {
        if (!hex || hex === 'transparent') return '.';
        const normalized = hex.toLowerCase();
        const entry = Object.entries(PALETTE).find(([, value]) => value.toLowerCase() === normalized);
        return entry ? entry[0] : '.';
      }

      function buildPixelIndex(x, y) {
        return y * GRID_SIZE + x;
      }

      function parseTemplateRows(rows) {
        const result = Array.from({ length: GRID_SIZE * GRID_SIZE }, () => null);
        for (let y = 0; y < GRID_SIZE; y += 1) {
          const row = rows[y] || ''.padEnd(GRID_SIZE, '.');
          for (let x = 0; x < GRID_SIZE; x += 1) {
            const char = row[x] || '.';
            const color = char === '.' ? null : getLookupColor(char);
            result[buildPixelIndex(x, y)] = color;
          }
        }
        return result;
      }

      function getLookupColor(char) {
        if (!char || char === '.') return null;
        const lookup = {
          '0': '#0d0d16', '1': '#f2f2f7', '2': '#b8b8c8', '3': '#6b6b85', '4': '#2a2a3d',
          'r': '#ef4444', 'R': '#991b1b', 'o': '#fb923c', 'y': '#facc15', 'Y': '#a16207',
          'g': '#4ade80', 'G': '#15803d', 'c': '#22d3ee', 'C': '#0e7490', 'b': '#60a5fa',
          'B': '#1d4ed8', 'p': '#c084fc', 'P': '#7e22ce', 'm': '#b45309', 'M': '#78350f',
          's': '#94a3b8'
        };
        return lookup[char] || null;
      }

      function createPalette() {
        paletteGrid.innerHTML = '';
        PALETTE_ORDER.forEach((key) => {
          const swatch = document.createElement('button');
          swatch.type = 'button';
          swatch.className = 'swatch';
          swatch.dataset.key = key;
          swatch.dataset.color = key;
          swatch.title = key === 'transparent' ? 'Erase / transparent' : key;
          swatch.style.background = key === 'transparent' ? 'transparent' : PALETTE[key];
          if (key === 'transparent') {
            swatch.style.border = '1px solid rgba(255,255,255,0.14)';
          }
          swatch.addEventListener('click', () => {
            state.selectedColor = key === 'transparent' ? 'transparent' : PALETTE[key];
            document.querySelectorAll('.swatch').forEach((el) => el.classList.toggle('is-selected', el.dataset.key === key));
          });
          paletteGrid.appendChild(swatch);
        });
        const defaultSwatch = document.querySelector('[data-key="y"]');
        if (defaultSwatch) defaultSwatch.classList.add('is-selected');
      }

      function createBoard() {
        for (let y = 0; y < GRID_SIZE; y += 1) {
          for (let x = 0; x < GRID_SIZE; x += 1) {
            const cell = document.createElement('button');
            cell.type = 'button';
            cell.className = 'pixel';
            cell.dataset.x = String(x);
            cell.dataset.y = String(y);
            cell.dataset.filled = 'false';
            cell.dataset.color = 'transparent';
            cell.setAttribute('aria-label', `Pixel ${x + 1}, ${y + 1}`);

            cell.addEventListener('pointerdown', (event) => {
              event.preventDefault();
              applyPaintAt(x, y);
            });

            cell.addEventListener('pointerenter', () => {
              if (eventButtonsDown.has(1)) {
                applyPaintAt(x, y);
              }
            });

            pixelBoard.appendChild(cell);
          }
        }
      }

      const eventButtonsDown = new Set();
      window.addEventListener('pointerdown', (event) => {
        if (event.pointerType !== 'mouse') return;
        if (event.button === 0) eventButtonsDown.add(1);
      });
      window.addEventListener('pointerup', () => eventButtonsDown.clear());
      window.addEventListener('pointerleave', () => eventButtonsDown.clear());

      function applyPaintAt(x, y) {
        const idx = buildPixelIndex(x, y);
        const targetColor = state.mode === 'erase' ? null : state.selectedColor;

        if (state.mode === 'fill') {
          fillRegion(x, y, state.selectedColor);
          render();
          return;
        }

        state.pixels[idx] = targetColor;
        render();
      }

      function fillRegion(x, y, replacementColor) {
        const startIndex = buildPixelIndex(x, y);
        const original = state.pixels[startIndex];
        if (original === replacementColor || (!original && !replacementColor)) {
          return;
        }

        const queue = [[x, y]];
        const visited = new Set([`${x},${y}`]);

        while (queue.length) {
          const [cx, cy] = queue.shift();
          const currentIndex = buildPixelIndex(cx, cy);
          const currentColor = state.pixels[currentIndex];

          if (currentColor === original) {
            state.pixels[currentIndex] = replacementColor;
          }

          const neighbors = [
            [cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]
          ];

          neighbors.forEach(([nx, ny]) => {
            if (nx < 0 || ny < 0 || nx >= GRID_SIZE || ny >= GRID_SIZE) return;
            const key = `${nx},${ny}`;
            if (visited.has(key)) return;
            visited.add(key);
            const neighborColor = state.pixels[buildPixelIndex(nx, ny)];
            if (neighborColor === original) queue.push([nx, ny]);
          });
        }
      }

      function renderBoard() {
        const cells = pixelBoard.children;
        [...cells].forEach((cell) => {
          const x = Number(cell.dataset.x);
          const y = Number(cell.dataset.y);
          const value = state.pixels[buildPixelIndex(x, y)];
          const color = value || 'transparent';
          cell.dataset.filled = color === 'transparent' ? 'false' : 'true';
          cell.dataset.color = color;
          cell.style.background = color === 'transparent' ? 'transparent' : color;
          cell.style.border = color === 'transparent' ? '1px solid rgba(255,255,255,0.04)' : 'none';
        });
      }

      function renderPreview() {
        spritePreview.innerHTML = '';
        for (let y = 0; y < GRID_SIZE; y += 1) {
          for (let x = 0; x < GRID_SIZE; x += 1) {
            const value = state.pixels[buildPixelIndex(x, y)] || 'transparent';
            const cell = document.createElement('div');
            cell.className = 'pixel';
            cell.dataset.filled = value === 'transparent' ? 'false' : 'true';
            cell.dataset.color = value;
            cell.style.background = value === 'transparent' ? 'transparent' : value;
            cell.style.border = value === 'transparent' ? '1px solid rgba(255,255,255,0.04)' : 'none';
            spritePreview.appendChild(cell);
          }
        }
      }

      function buildExportString() {
        const rows = [];
        for (let y = 0; y < GRID_SIZE; y += 1) {
          let row = '';
          for (let x = 0; x < GRID_SIZE; x += 1) {
            const cellValue = state.pixels[buildPixelIndex(x, y)];
            row += cellValue ? charFromHex(cellValue) : '.';
          }
          rows.push(`'${row}',`);
        }
        return `sprite: [\n  ${rows.join('\n  ')}\n]`;
      }

      function render() {
        renderBoard();
        renderPreview();
        exportBox.value = buildExportString();
      }

      function setTemplate(name) {
        const rows = GAME_TEMPLATES[name] || GAME_TEMPLATES.blank;
        state.activeTemplate = name;
        state.pixels = parseTemplateRows(rows);
        render();
      }

      function clearGrid() {
        state.pixels = Array.from({ length: GRID_SIZE * GRID_SIZE }, () => null);
        render();
      }

      function randomizeGrid() {
        const colors = ['#ef4444', '#facc15', '#4ade80', '#22d3ee', '#60a5fa', '#c084fc', '#fb923c', '#f2f2f7', '#0d0d16'];
        state.pixels = state.pixels.map(() => {
          if (Math.random() > 0.63) return colors[Math.floor(Math.random() * colors.length)];
          return null;
        });
        render();
      }

      templateSelect.addEventListener('change', (event) => setTemplate(event.target.value));

      document.getElementById('paintMode').addEventListener('click', () => {
        state.mode = 'paint';
        document.getElementById('paintMode').classList.add('is-active');
        document.getElementById('eraseMode').classList.remove('is-active');
        document.getElementById('fillMode').classList.remove('is-active');
      });

      document.getElementById('eraseMode').addEventListener('click', () => {
        state.mode = 'erase';
        document.getElementById('eraseMode').classList.add('is-active');
        document.getElementById('paintMode').classList.remove('is-active');
        document.getElementById('fillMode').classList.remove('is-active');
      });

      document.getElementById('fillMode').addEventListener('click', () => {
        state.mode = 'fill';
        document.getElementById('fillMode').classList.add('is-active');
        document.getElementById('paintMode').classList.remove('is-active');
        document.getElementById('eraseMode').classList.remove('is-active');
      });

      document.getElementById('clearBtn').addEventListener('click', clearGrid);
      document.getElementById('randomBtn').addEventListener('click', randomizeGrid);

      drawerToggle.addEventListener('click', () => {
        const shell = document.querySelector('.shell');
        shell.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });

      createPalette();
      createBoard();
      setTemplate('blank');
      render();
    </script>
  </body>
</html>
